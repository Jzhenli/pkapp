name: release
# pkapp 发布制品：包内置壳（零编译壳）+ applocal 离线 wheel + pkapp wheel。
# tag 推送（v*）→ GitHub Release；workflow_dispatch → 仅出 artifact 供试用。
# 产物使用：pip install pkapp-*.whl 后 create/build/package 全链路零编译零手工 wheel。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # softprops/action-gh-release 创建 Release 需要写权限

jobs:
  launcher-linux:
    # ★M3 阶段 2 条 6★ launcher ELF（manylinux2014 同容器编译，glibc 2.17 地板
    # 对齐 D-2/D-12 v5）——artifact 供 pkapp-wheel job 收录 _vendor/shell-linux。
    # PYINC：解压同 pin PBS linux 快照取 include/（PyConfig 头，不链 libpython）。
    # ★Node24 兼容★ GitHub Actions 已强制 JS action 跑 Node24（glibc≥2.28），
    # manylinux2014（CentOS7，glibc 2.17）容器内无法再执行 checkout/upload 等
    # JS action → 改宿主跑 checkout/PBS/artifact，仅编译步骤 docker run 进容器。
    # ★ubuntu-24.04 显式 pin★（ubuntu-latest 2026-10 起漂移 Ubuntu 26，runner-images#14748）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PBS headers (toolchain pin 同源)
        run: |
          curl -fsSLo /tmp/pbs.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20260929/cpython-3.12.14%2B20260929-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          mkdir -p /tmp/pbs && tar -xzf /tmp/pbs.tar.gz -C /tmp/pbs
          # 跨 step 环境变量必须写 $GITHUB_ENV（echo 裸输出不共享）
          echo "PYINC=$(ls -d /tmp/pbs/python/include/python3.*)" >> "$GITHUB_ENV"
      - name: Build launcher + keylib (manylinux2014 容器内编译)
        # 编译须在容器内（glibc 2.17 头/链接器地板）；PBS 头只读挂载，PYINC 经
        # -e 传入（宿主展开），容器内 bash -c 单引号防宿主二次展开。
        # keylib 通用件同容器编译（key.c + kdata.c 锚点形态 = patch_dll 退化位
        # 源；glibc 基线与 launcher 严格一致，★linux 预制件 2026-10★）。
        run: >
          docker run --rm -v /tmp/pbs:/tmp/pbs:ro -v "$PWD":/io -w /io/shell-linux
          -e PYINC="$PYINC"
          quay.io/pypa/manylinux2014_x86_64
          bash -c './build.sh myapp "" "$PYINC" &&
                   mkdir -p /io/keylib/build/linux/x86_64 &&
                   gcc -O2 -shared -fPIC -std=c17 /io/keylib/src/key.c /io/keylib/src/kdata.c -o /io/keylib/build/linux/x86_64/pkapp_key.so'
      - name: Selftest (算法向量，宿主执行——glibc 2.31 ≥ 2.17 地板)
        run: ./shell-linux/build/myapp --selftest
      - name: Stage artifacts (arch 子目录统一布局，三 job 同构)
        run: |
          mkdir -p stage/x86_64
          cp shell-linux/build/myapp stage/x86_64/myapp
          cp keylib/build/linux/x86_64/pkapp_key.so stage/x86_64/pkapp_key.so
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: stage

  launcher-linux-aarch64:
    # ★M3 阶段 5 前置★ aarch64 launcher ELF：原生 arm runner（公共仓库免费）+
    # manylinux2014_aarch64 容器编译——glibc 2.17 地板与 x86_64 基线同口径（D-2/D-8）。
    # ★Node24 约束同 x86_64 job★：JS action 走宿主，编译/selftest docker run 进容器。
    # PYINC = 同 pin release（20260929）aarch64 快照头——pyconfig.h 是 configure
    # 平台配置件（SIZEOF_LONG 等按 arch 烤死），必须取本 arch 头勿跨用（armv7l
    # 用 x86_64 头实测触发 pyport.h LONG_BIT 守卫 #error；aarch64 LP64 兼容但
    # 同源口径更净）。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PBS headers (同 pin 20260929，aarch64 资产)
        run: |
          curl -fsSLo /tmp/pbs.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20260929/cpython-3.12.14%2B20260929-aarch64-unknown-linux-gnu-install_only_stripped.tar.gz"
          mkdir -p /tmp/pbs && tar -xzf /tmp/pbs.tar.gz -C /tmp/pbs
          echo "PYINC=$(ls -d /tmp/pbs/python/include/python3.*)" >> "$GITHUB_ENV"
      - name: Build launcher + keylib (manylinux2014_aarch64 容器内编译)
        # keylib 通用件同容器编译（同 launcher glibc 基线，★linux 预制件 2026-10★）
        run: >
          docker run --rm -v /tmp/pbs:/tmp/pbs:ro -v "$PWD":/io -w /io/shell-linux
          -e PYINC="$PYINC"
          quay.io/pypa/manylinux2014_aarch64
          bash -c './build.sh myapp "" "$PYINC" &&
                   mkdir -p /io/keylib/build/linux/aarch64 &&
                   gcc -O2 -shared -fPIC -std=c17 /io/keylib/src/key.c /io/keylib/src/kdata.c -o /io/keylib/build/linux/aarch64/pkapp_key.so'
      - name: Selftest (arm runner 容器内原生执行)
        run: >
          docker run --rm -v "$PWD":/io -w /io/shell-linux
          quay.io/pypa/manylinux2014_aarch64 ./build/myapp --selftest
      - name: Stage artifacts (arch 子目录统一布局，三 job 同构)
        run: |
          mkdir -p stage/aarch64
          cp shell-linux/build/myapp stage/aarch64/myapp
          cp keylib/build/linux/aarch64/pkapp_key.so stage/aarch64/pkapp_key.so
      - uses: actions/upload-artifact@v7
        with:
          name: linux-aarch64
          path: stage

  launcher-linux-armv7l:
    # ★M3 阶段 5 前置★ armv7 launcher ELF：ubuntu:20.04 交叉链（D-2 v4 拍板——
    # manylinux2014 不提供 armhf 交叉链，sysroot glibc 2.31 与板子对齐，与 x86_64
    # 2.17 为两条并行基线勿混读）。QEMU user 模式跑 --selftest 16 向量关闸
    #（编译产物 armhf 无法在 x86_64 宿主执行；真机验收随阶段 5 板子线）。
    # focal 已 EOL：apt 源 archive 失效时回退 old-releases。
    # PYINC = 同 pin release（20260929）armv7 快照头——pyconfig.h 是 configure
    # 平台配置件（SIZEOF_LONG=4，ILP32 烤死），x86_64 头在 armhf 目标触发
    # pyport.h LONG_BIT 守卫（LONG_BIT=32 ≠ 8×8）#error，实测踩坑勿回退。
    # ★ubuntu-24.04 显式 pin★（ubuntu-latest 漂移 Ubuntu 26；交叉链镜像 ubuntu:20.04 不变）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PBS headers (同 pin 20260929，armv7 资产)
        run: |
          curl -fsSLo /tmp/pbs.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20260929/cpython-3.12.14%2B20260929-armv7-unknown-linux-gnueabihf-install_only_stripped.tar.gz"
          mkdir -p /tmp/pbs && tar -xzf /tmp/pbs.tar.gz -C /tmp/pbs
          echo "PYINC=$(ls -d /tmp/pbs/python/include/python3.*)" >> "$GITHUB_ENV"
      - name: Cross-build + QEMU selftest (ubuntu:20.04 容器内)
        run: >
          docker run --rm -v /tmp/pbs:/tmp/pbs:ro -v "$PWD":/io -w /io/shell-linux
          -e PYINC="$PYINC" -e DEBIAN_FRONTEND=noninteractive
          ubuntu:20.04 bash -c '
            set -e
            apt-get update >/dev/null 2>&1 || {
              sed -i -e "s|archive.ubuntu.com|old-releases.ubuntu.com|g" -e "s|security.ubuntu.com|old-releases.ubuntu.com|g" /etc/apt/sources.list;
              apt-get update; }
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user >/dev/null
            CC=arm-linux-gnueabihf-gcc ./build.sh myapp "" "$PYINC"
            qemu-arm -L /usr/arm-linux-gnueabihf ./build/myapp --selftest
            mkdir -p /io/keylib/build/linux/armv7l
            arm-linux-gnueabihf-gcc -O2 -shared -fPIC -std=c17 /io/keylib/src/key.c /io/keylib/src/kdata.c -o /io/keylib/build/linux/armv7l/pkapp_key.so
          '
      - name: Stage artifacts (arch 子目录统一布局，三 job 同构)
        run: |
          mkdir -p stage/armv7l
          cp shell-linux/build/myapp stage/armv7l/myapp
          cp keylib/build/linux/armv7l/pkapp_key.so stage/armv7l/pkapp_key.so
      - uses: actions/upload-artifact@v7
        with:
          name: linux-armv7l
          path: stage

  pkapp-wheel:
    needs: [launcher-linux, launcher-linux-aarch64, launcher-linux-armv7l]
    runs-on: windows-latest      # 壳是 MSVC /MT 产物，构建机须带 VS2022 C++ 工具链
    env:
      PYTHONUTF8: "1"            # runner 默认 cp1252，中文输出/构建日志统一 UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: Download linux artifacts (三 launcher job：launcher ELF + keylib so)
        # pattern + merge-multiple：三 artifact 合并落 vendor-src/<arch>/{myapp,pkapp_key.so}
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: vendor-src
          merge-multiple: true
      - name: Place artifacts → vendor 源位（shell-linux/keylib 双 arch 分位）
        shell: bash
        run: |
          mkdir -p shell-linux/build/aarch64 shell-linux/build/armv7l \
                   keylib/build/linux/x86_64 keylib/build/linux/aarch64 keylib/build/linux/armv7l
          cp vendor-src/x86_64/myapp shell-linux/build/myapp
          cp vendor-src/aarch64/myapp shell-linux/build/aarch64/myapp
          cp vendor-src/armv7l/myapp shell-linux/build/armv7l/myapp
          for a in x86_64 aarch64 armv7l; do
            cp vendor-src/$a/pkapp_key.so keylib/build/linux/$a/pkapp_key.so
          done
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag == pyproject version (tag-only，防版本漂移)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pkapp/pyproject.toml','rb'))['project']['version'])")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 pkapp/pyproject.toml version ${PKG_VER} 不一致，拒绝发布"
            exit 1
          fi
          echo "version check ok: v${PKG_VER}"
      - name: Build Windows shell (build.bat)
        working-directory: shell-windows
        run: .\build.bat
      - name: Build keylib key-holder (build.bat)
        working-directory: keylib
        run: .\build.bat
      - name: Vendor _vendor (shell + launcher ELF ×3 + keylib dll/so ×4 + applocal wheel)
        # 全量 require：发布件完整性闸门（H4 fail-fast）——任何条目缺件拒绝出制品；
        # launcher + linux keylib 三 arch 全 require（arm job 失败不得静默出缺 arch 的 wheel）。
        # pip install -e pkapp：vendor 的锚点字节校验要导入 pkapp.packager.keylib
        # （ANCHOR_HEX 单源），包元数据未装则 PackageNotFoundError → SKIP（2026-10-26 实测）。
        run: |
          python -m pip install -q -e pkapp
          python pkapp/scripts/vendor.py --require shell-windows,shell-linux-x86_64,shell-linux-aarch64,shell-linux-armv7l,keylib-windows,keylib-linux-x86_64,keylib-linux-aarch64,keylib-linux-armv7l,keylib-src,shell-android,applocal-wheel
      - name: Build pkapp wheel
        run: |
          python -m pip install -q build
          python -m build --wheel pkapp
      - uses: actions/upload-artifact@v7
        with:
          name: pkapp-wheel
          path: pkapp/dist/*.whl
      - name: Publish to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkapp/dist/*.whl
