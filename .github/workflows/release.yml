name: release
# pkapp 发布制品：包内置壳（零编译壳）+ applocal 离线 wheel + pkapp wheel。
# tag 推送（v*）→ GitHub Release；workflow_dispatch → 仅出 artifact 供试用。
# 产物使用：pip install pkapp-*.whl 后 create/build/package 全链路零编译零手工 wheel。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # softprops/action-gh-release 创建 Release 需要写权限

jobs:
  launcher-linux:
    # ★M3 阶段 2 条 6★ launcher ELF（manylinux2014 同容器编译，glibc 2.17 地板
    # 对齐 D-2/D-12 v5）——artifact 供 pkapp-wheel job 收录 _vendor/shell-linux。
    # PYINC：解压同 pin PBS linux 快照取 include/（PyConfig 头，不链 libpython）。
    # ★Node24 兼容★ GitHub Actions 已强制 JS action 跑 Node24（glibc≥2.28），
    # manylinux2014（CentOS7，glibc 2.17）容器内无法再执行 checkout/upload 等
    # JS action → 改宿主跑 checkout/PBS/artifact，仅编译步骤 docker run 进容器。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PBS headers (toolchain pin 同源)
        run: |
          curl -fsSLo /tmp/pbs.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20260929/cpython-3.12.14%2B20260929-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          mkdir -p /tmp/pbs && tar -xzf /tmp/pbs.tar.gz -C /tmp/pbs
          # 跨 step 环境变量必须写 $GITHUB_ENV（echo 裸输出不共享）
          echo "PYINC=$(ls -d /tmp/pbs/python/include/python3.*)" >> "$GITHUB_ENV"
      - name: Build launcher (build.sh 默认名 myapp，manylinux2014 容器内编译)
        # 编译须在容器内（glibc 2.17 头/链接器地板）；PBS 头只读挂载，PYINC 经
        # -e 传入（宿主展开），容器内 bash -c 单引号防宿主二次展开。
        run: >
          docker run --rm -v /tmp/pbs:/tmp/pbs:ro -v "$PWD":/io -w /io/shell-linux
          -e PYINC="$PYINC"
          quay.io/pypa/manylinux2014_x86_64
          bash -c './build.sh myapp "" "$PYINC"'
      - name: Selftest (算法向量，宿主执行——glibc 2.31 ≥ 2.17 地板)
        run: ./shell-linux/build/myapp --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-elf-x86_64
          path: shell-linux/build/myapp

  pkapp-wheel:
    needs: launcher-linux
    runs-on: windows-latest      # 壳是 MSVC /MT 产物，构建机须带 VS2022 C++ 工具链
    env:
      PYTHONUTF8: "1"            # runner 默认 cp1252，中文输出/构建日志统一 UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Download launcher artifact → vendor 源位
        uses: actions/download-artifact@v4
        with:
          name: launcher-elf-x86_64
          path: shell-linux/build        # _vendor_shell_linux 源位（…/build/myapp）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag == pyproject version (tag-only，防版本漂移)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pkapp/pyproject.toml','rb'))['project']['version'])")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 pkapp/pyproject.toml version ${PKG_VER} 不一致，拒绝发布"
            exit 1
          fi
          echo "version check ok: v${PKG_VER}"
      - name: Build Windows shell (build.bat)
        working-directory: shell-windows
        run: .\build.bat
      - name: Build keylib key-holder (build.bat)
        working-directory: keylib
        run: .\build.bat
      - name: Vendor _vendor (shell + keylib + applocal wheel)
        # 全量 require：发布件完整性闸门（H4 fail-fast）——任何条目缺件拒绝出制品
        run: python pkapp/scripts/vendor.py --require shell-windows,keylib-windows,keylib-src,shell-android,applocal-wheel
      - name: Build pkapp wheel
        run: |
          python -m pip install -q build
          python -m build --wheel pkapp
      - uses: actions/upload-artifact@v4
        with:
          name: pkapp-wheel
          path: pkapp/dist/*.whl
      - name: Publish to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkapp/dist/*.whl
