[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "pkapp"
version = "0.1.0"
description = "pkapp — 跨平台 Python 应用打包 CLI（七命令：create/dev/build/check/doctor/package/fetch）"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "pillow>=10",
]

[project.scripts]
pkapp = "pkapp.cli:main"

[tool.setuptools.packages.find]
include = ["pkapp*"]

# 内置制品（scripts/vendor.py 组装，源缺失时构建照常——代码侧全部容忍缺失）：
# _vendor/shell/MyApp.exe + WebView2Loader.dll（零编译壳）、_vendor/wheels/*.whl（applocal）
[tool.setuptools.package-data]
pkapp = ["_vendor/**/*"]
