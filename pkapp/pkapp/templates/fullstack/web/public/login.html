<!doctype html>
<!-- 自包含登录页（applocal 门约定 ui/login.html；★v1.2★ UI 归 dist）。
     未登录时所有静态资源都在门后（302 /login），故此页必须单文件内联 JS/CSS，
     不得引用 /assets/*。POST /login 吃 form-urlencoded 字段 user + password，
     成功 302 → / 并种 HttpOnly 会话 Cookie。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{name} 登录</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh;
         align-items: center; justify-content: center; margin: 0;
         background: #f3f4f6; color: #213547; }
  form { background: #fff; padding: 2rem; border-radius: 8px; width: 260px;
         box-shadow: 0 1px 4px rgba(0, 0, 0, .1); box-sizing: content-box; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; text-align: center; }
  input { width: 100%; padding: .5rem; margin: .4rem 0; box-sizing: border-box;
          border: 1px solid #d1d5db; border-radius: 4px; }
  button { width: 100%; padding: .5rem; margin-top: .6rem; background: #2563eb;
           color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: #c0392b; font-size: .85rem; margin: .4rem 0 0; }
</style>
</head>
<body>
<form id="login">
  <h1>{name}</h1>
  <input name="user" placeholder="用户名" required autofocus autocomplete="username">
  <input name="password" type="password" placeholder="密码" required autocomplete="current-password">
  <p id="err" class="error" hidden></p>
  <button id="btn" type="submit">登录</button>
</form>
<script>
  const form = document.getElementById('login')
  const err = document.getElementById('err')
  const btn = document.getElementById('btn')

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    err.hidden = true
    btn.disabled = true
    btn.textContent = '登录中…'
    try {
      const r = await fetch('/login', {
        method: 'POST',
        headers: { 'content-type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(form)),
      })
      if (r.ok) {                       // 302 已被 fetch 跟随，Cookie 已种 → 进 SPA
        location.replace('/')
        return
      }
      err.textContent = r.status === 401 ? '用户名或密码错误' : `登录失败（HTTP ${r.status}）`
    } catch {
      err.textContent = '网络错误，请重试'
    }
    err.hidden = false
    btn.disabled = false
    btn.textContent = '登录'
  })
</script>
</body>
</html>
